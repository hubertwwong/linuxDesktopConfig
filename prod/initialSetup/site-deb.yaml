---
# ==============================================================================
# Debian Server / Remote Desktop Provisioning Playbook (with XRDP & Syncthing)
# ==============================================================================
- name: Run Debian Remote Desktop Playbook
  hosts: localhost
  pre_tasks:
    - name: Load distribution specific variables
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "{{ ansible_distribution }}.yml"
            - "{{ ansible_distribution | replace(' ', '') }}.yml"
            - "{{ ansible_os_family }}.yml"
            - "default.yml"
          paths:
            - "{{ playbook_dir }}/../vars/distros"

  roles:
    - initial_packages
    - timezone
    - dot
    - chrome
    - vscode_apt
    - python
    - git
    - docker_ce
    - mise
    - syncthing
    - xrdp
    - ghostty
