---
- name: Ghostty - Check if ghostty is installed
  ansible.builtin.command: which ghostty
  register: ghostty_check
  failed_when: false
  changed_when: false

- name: Ghostty - Determine distribution and architecture
  ansible.builtin.set_fact:
    ghostty_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
    ghostty_raw_codename: "{{ ghostty_codename | default(('trixie' if ansible_distribution == 'Debian' and ansible_distribution_release not in ['trixie', 'forky'] else ansible_distribution_release)) }}"

- name: Ghostty - Resolve release target name
  ansible.builtin.set_fact:
    ghostty_target_codename: "{{ {'noble': '24.04', 'jammy': '24.04', 'focal': '24.04', 'wilma': '24.04', 'virginia': '24.04', 'victoria': '24.04', 'vera': '24.04', 'vanessa': '24.04', 'bookworm': 'trixie', 'bullseye': 'trixie'}[ghostty_raw_codename] | default(ghostty_raw_codename) }}"

- name: Ghostty - Query latest release metadata from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/mkasberg/ghostty-ubuntu/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
  register: ghostty_release_json
  when: ghostty_check.rc != 0

- name: Ghostty - Find matching deb download URL
  ansible.builtin.set_fact:
    ghostty_deb_candidates: "{{ (ghostty_release_json.content | from_json).assets | selectattr('browser_download_url', 'search', ghostty_arch ~ '_' ~ ghostty_target_codename ~ '\\.deb$') | map(attribute='browser_download_url') | list }}"
  when: ghostty_check.rc != 0

- name: Ghostty - Set deb download URL
  ansible.builtin.set_fact:
    ghostty_deb_url: "{{ ghostty_deb_candidates[0] if (ghostty_deb_candidates | default([]) | length > 0) else '' }}"
  when: ghostty_check.rc != 0

- name: Ghostty - Fallback URL if asset query did not return
  ansible.builtin.set_fact:
    ghostty_deb_url: "https://github.com/mkasberg/ghostty-ubuntu/releases/download/1.3.1-0-ppa2/ghostty_1.3.1-0.ppa2_{{ ghostty_arch }}_{{ 'trixie' if (ansible_distribution == 'Debian' or ghostty_target_codename in ['trixie', 'forky']) else '24.04' }}.deb"
  when: ghostty_check.rc != 0 and (ghostty_deb_url is not defined or ghostty_deb_url == '')

- name: Ghostty - Download deb package
  ansible.builtin.get_url:
    url: "{{ ghostty_deb_url }}"
    dest: /tmp/ghostty.deb
    mode: '0644'
  when: ghostty_check.rc != 0

- name: Ghostty - Install deb package
  ansible.builtin.apt:
    deb: /tmp/ghostty.deb
    state: present
  become: yes
  when: ghostty_check.rc != 0

- name: Ghostty - Remove temporary deb
  ansible.builtin.file:
    path: /tmp/ghostty.deb
    state: absent
  when: ghostty_check.rc != 0

- name: Ghostty - Configure as default x-terminal-emulator
  ansible.builtin.alternatives:
    name: x-terminal-emulator
    path: /usr/bin/ghostty
    priority: 50
  become: yes

- name: Ghostty - Ensure config directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'

- name: Ghostty - Remove conflicting config.ghostty if present
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/ghostty/config.ghostty"
    state: absent

- name: Ghostty - Deploy user configuration
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.config/ghostty/config"
    content: |
      # Ghostty Configuration
      theme = Gruvbox Dark
      font-size = 13
      gtk-titlebar = true
      window-decoration = auto
      copy-on-select = clipboard
      confirm-close-surface = false
    mode: '0644'
