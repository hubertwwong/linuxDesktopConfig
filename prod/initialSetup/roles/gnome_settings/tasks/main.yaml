---
- name: Disable gnome lock on suspend password prompt
  ansible.builtin.command: gsettings set org.gnome.desktop.screensaver lock-enabled false
  when: desktop_environment | default('gnome') == 'gnome'
  failed_when: false
  changed_when: true

- name: Set 12 hour clock format
  ansible.builtin.command: gsettings set org.gnome.desktop.interface clock-format '12h'
  when: desktop_environment | default('gnome') == 'gnome'
  failed_when: false
  changed_when: true
