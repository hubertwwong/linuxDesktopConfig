---
# ==============================================================================
# Tailscale Installation & Service Configuration Role
# ==============================================================================

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  become: yes

- name: Download Tailscale signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_distro | default(distro_upstream_family) }}/{{ tailscale_codename | default(distro_upstream_release) }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  become: yes

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ tailscale_distro | default(distro_upstream_family) }} {{ tailscale_codename | default(distro_upstream_release) }} main"
    state: present
    filename: tailscale
    update_cache: yes
  become: yes

- name: Install Tailscale package
  ansible.builtin.package:
    name:
      - tailscale
    state: present
  become: yes

- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: yes
  become: yes

- name: Check Tailscale login status
  ansible.builtin.command: tailscale status
  register: tailscale_status_check
  failed_when: false
  changed_when: false

- name: Authenticate with Tailscale authkey (if provided)
  ansible.builtin.command: >
    tailscale up
    --authkey={{ tailscale_authkey }}
    {{ '--ssh' if tailscale_enable_ssh else '' }}
    {{ ('--operator=' ~ tailscale_operator_user) if tailscale_set_operator else '' }}
  become: yes
  when:
    - tailscale_authkey != ""
    - tailscale_status_check.rc != 0 or 'Logged out' in tailscale_status_check.stdout

- name: Enable Tailscale SSH and operator for active node
  ansible.builtin.command: >
    tailscale set
    {{ '--ssh=true' if tailscale_enable_ssh else '--ssh=false' }}
    {{ ('--operator=' ~ tailscale_operator_user) if tailscale_set_operator else '' }}
  become: yes
  when:
    - tailscale_status_check.rc == 0
    - "'Logged out' not in tailscale_status_check.stdout"
  changed_when: true

- name: Notice for interactive authentication if not yet logged in
  ansible.builtin.debug:
    msg: "Tailscale is installed. Run 'sudo tailscale up {{ '--ssh' if tailscale_enable_ssh else '' }}' to log in."
  when:
    - tailscale_authkey == ""
    - tailscale_status_check.rc != 0 or 'Logged out' in tailscale_status_check.stdout
