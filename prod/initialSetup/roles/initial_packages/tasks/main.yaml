---
- name: Install some basic packages
  package:
    name:
      - apt-transport-https
      - curl
      - git
      - gpg 
      - htop
      - software-properties-common
      - vim
      - wget
    state: present
    update_cache: true
  become: yes

- name: Install desktop utility packages
  package:
    name:
      - keepassxc
      - libavcodec-extra
      - synaptic
    state: present
    update_cache: true
  become: yes

- name: Install GNOME integration packages
  package:
    name:
      - gnome-online-accounts
    state: present
    update_cache: true
  become: yes
  when: desktop_environment | default('gnome') == 'gnome'
